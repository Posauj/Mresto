<div class="grid grid-cols-[1fr_auto] gap-2 mt-2"><select class="in" aria-label="Категория" value=${nm.c} onChange=${e=>setNm({...nm,c:e.target.value})}>${CATS.map(c=>html`<option key=${c}>${c}</option>`)}</select><button class="btn" onClick=${()=>{if(!nm.n||!+nm.p)return say('Укажите название и цену');setMenu(m=>[...m,{id:Date.now(),c:nm.c,n:nm.n,d:'Новая позиция',v:null,p:+nm.p,t:'Новинка'}]);setNm({...nm,n:'',p:''})}}>Добавить</button></div>
${H('Все блюда и цены')}${menu.map(i=>html`<div key=${i.id} class="grid grid-cols-[1fr_6rem] gap-2 mt-2 items-center"><input class="in" aria-label="Название" value=${i.n} onInput=${e=>setMenu(m=>m.map(x=>x.id==i.id?{...x,n:e.target.value}:x))}/>${i.v?html`<span class="text-sm m2">от ${i.p} ₽</span>`:html`<input class="in" aria-label="Цена" inputmode="numeric" value=${i.p} onInput=${e=>setMenu(m=>m.map(x=>x.id==i.id?{...x,p:+e.target.value||0}:x))}/>`}</div>`)}`}
${at=='bk'&&html`${H('Брони ('+books.length+')')}${!books.length&&html`<p class="m2">Броней пока нет.</p>`}${books.map(b=>html`<div key=${b.id} class="card mt-2 text-[15px]"><b class="tn">${b.date} ${b.time}</b> · ${b.guests} гост. · ${b.zone}<div class="m2">${b.name} ${b.phone}${b.note?' · '+b.note:''}</div></div>`)}`}
${at=='acc'&&html`${H('Доступ сотрудников')}<p class="m2 text-sm">Вход по PIN. После 5 неверных попыток вход закрывается на время, через 5 минут без действий сеанс завершается. Укажите от 6 до 8 цифр.</p>
<div class="grid gap-2 mt-3"><input class="in" type="password" inputmode="numeric" autocomplete="off" aria-label="Новый PIN владельца" placeholder="Новый PIN владельца" value=${np.o} onInput=${e=>setNp({...np,o:e.target.value})}/><input class="in" type="password" inputmode="numeric" autocomplete="off" aria-label="Новый PIN кухни" placeholder="Новый PIN кухни" value=${np.k} onInput=${e=>setNp({...np,k:e.target.value})}/>
<button class="btn" onClick=${async()=>{const ok=v=>/^\d{6,8}$/.test(v);if(!np.o&&!np.k)return say('Введите новый PIN');if((np.o&&!ok(np.o))||(np.k&&!ok(np.k)))return say('PIN: от 6 до 8 цифр');const n={...pins};try{if(np.o)n.owner=await mkPin(np.o);if(np.k)n.kitchen=await mkPin(np.k);if((await chkPin(np.o||'-',n.kitchen))||(await chkPin(np.k||'-',n.owner)))return say('PIN владельца и кухни должны отличаться')}catch(e){return say('Защищённый вход недоступен')}setPins(n);ls.set('tr.pins2',n);setNp({o:'',k:''});say('PIN сохранён на этом устройстве')}}>Сохранить PIN</button></div>
<p class="panel mt-5 text-sm">Честно о защите: PIN работает на этом устройстве и закрывает экраны от гостей на сайте. Настоящая защита, когда заказы видны на разных телефонах, возможна только с сервером и личными аккаунтами. Это следующий шаг.</p>`}</div>`};

const StaffBar=()=>html`<div class="sticky top-0 z-40 px-4 py-2 bar2"><div class="max-w-3xl mx-auto flex items-center gap-2"><div class="flex-1">${role=='owner'?Seg([[1,'Кухня'],[2,'Владелец'+(alerts.length?' ('+alerts.length+')':'')]],mode,setMode):html`<b class="f text-xl">Кухня</b>`}</div><button class="btn alt sm" onClick=${()=>setMode(0)}>Витрина</button><button class="btn alt sm" onClick=${()=>{setRole(null);setMode(0)}}>Выйти</button></div></div>`;

const Lock=()=>{const wait=Math.max(0,Math.ceil((lk.u-now)/1000));
if(!pins)return html`<div class="max-w-xs mx-auto px-5 pt-10 pb-20 text-center slide"><div class="f text-[34px]">T'Resto</div><h1 class="f text-[26px] mt-3">Первый запуск</h1><p class="m2 text-sm mt-1">Придумайте PIN владельца и отдельный PIN кухни. От 6 до 8 цифр. Они хранятся только на этом устройстве.</p>
<div class="grid gap-3 mt-5 text-left"><input class="in" type="password" inputmode="numeric" autocomplete="new-password" maxLength=${8} aria-label="PIN владельца" placeholder="PIN владельца" value=${np.o} onInput=${e=>setNp({...np,o:e.target.value.replace(/\D/g,'')})}/><input class="in" type="password" inputmode="numeric" autocomplete="new-password" maxLength=${8} aria-label="PIN кухни" placeholder="PIN кухни" value=${np.k} onInput=${e=>setNp({...np,k:e.target.value.replace(/\D/g,'')})}/></div>
<p role="alert" class="text-sm mt-2 min-h-[22px] font-semibold" style=${{color:'var(--bad)'}}>${perr}</p><button class="btn w-full mt-2" onClick=${setup}>Сохранить и войти</button><button class="m2 underline underline-offset-4 text-sm mt-8" onClick=${()=>setMode(0)}>Вернуться в меню</button></div>`;
return html`<div class="max-w-xs mx-auto px-5 pt-10 pb-20 text-center slide"><div class="f text-[34px]">T'Resto</div><h1 class="f text-[26px] mt-3">Вход для сотрудников</h1><p class="m2 text-sm mt-1">Только для поваров и владельца.</p>
<div class="panel mt-5 flex justify-center gap-3 py-4" aria-label="Введено цифр: ${pin.length}">${Array.from({length:Math.max(6,pin.length)},(_,i)=>html`<span key=${i} class="w-3.5 h-3.5 rounded-full" style=${i<pin.length?{background:'var(--cu)'}:{boxShadow:'inset 0 0 0 1.5px var(--line)'}}></span>`)}</div>
<p role="alert" class="text-sm mt-2 min-h-[22px] font-semibold" style=${{color:'var(--bad)'}}>${wait?'Вход закрыт на '+wait+' сек.':perr}</p>
<div class="grid grid-cols-3 gap-3 mt-3">${['1','2','3','4','5','6','7','8','9','Стереть','0','Войти'].map(k=>html`<button key=${k} class="btn ${k=='Войти'?'':'alt'}" style=${{minHeight:'58px',fontSize:k.length>1?'15px':'22px'}} disabled=${!!wait} onClick=${()=>k=='Стереть'?setPin(p=>p.slice(0,-1)):k=='Войти'?submit():setPin(p=>p.length<8?p+k:p)}>${k}</button>`)}</div>
<button class="m2 underline underline-offset-4 text-sm mt-8" onClick=${()=>setMode(0)}>Вернуться в меню</button></div>`};

const v=!locked?mode:3,vv=mode==2&&role!='owner'?1:v;
useEffect(()=>{document.body.className=vv==0?'g':'s'});
return html`<div>${role&&(vv==1||vv==2)?StaffBar():null}${vv==0?Store():vv==3?Lock():vv==1?Kitchen():Admin()}${msg&&html`<div role="status" class="fixed inset-x-0 z-50 px-4 slide" style="top:calc(12px + env(safe-area-inset-top,0px))"><div class="card max-w-md mx-auto font-semibold">${msg}</div></div>`}</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script></body></html>
